<!-- =========================
     AGNI CHATBOT WIDGET
     Include this HTML wherever you want the widget to appear
     (e.g. just before the closing </body> tag).
     Requires: agni-widget.css and agni-widget.js in the same folder,
     or update the href/src paths below to match your project structure.
========================= -->

<link rel="stylesheet" href="agni-widget.css" />

<div id="agni-widget">
  <!-- Chat window -->
  <section
    class="agni-chatbox"
    id="agniChatbox"
    aria-label="Agni academic support chatbot"
  >
    <header class="agni-header">
      <div class="agni-brand">
        <div class="agni-logo" aria-hidden="true">
          <!-- Fire logo -->
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M13.5 2.5c.5 3.3-1.4 4.5-2.7 6.1-1.1 1.3-1.5 2.6-.9 4.2.3-1.7 1.5-2.6 2.8-3.4-.1 2.2 1.9 3.4 2.1 5.4.2-1.2-.1-2.3-.7-3.3 2.1 1.7 3.3 3.6 3.3 5.8 0 3.4-2.7 5.8-6.1 5.8s-6.3-2.4-6.3-6c0-3.1 2.1-5.2 4.4-7.2-.2 2.1.3 3.4 1.3 4.2-.6-2.8 1.4-5.2 2.8-7.1.8-1.1 1.3-2.8 0-4.5Z"
              fill="white"
            />
          </svg>
        </div>

        <div>
          <p class="agni-title">Agni</p>
          <div class="agni-status">AB Smart Solution Assistant</div>
        </div>
      </div>

      <button class="agni-close" id="agniClose" aria-label="Close chat">
        ×
      </button>
    </header>

    <div class="agni-messages" id="agniMessages"></div>

    <div class="agni-quick">
      <button data-question="What services do you provide?">
        Our Services
      </button>
      <button data-question="Can you help me choose a research topic?">
        Research Topic
      </button>
      <button data-question="Do you provide SPSS and Excel support?">
        SPSS Support
      </button>
      <button data-question="How can I contact AB Smart Solution?">
        Contact
      </button>
    </div>

    <form class="agni-input-area" id="agniForm">
      <textarea
        class="agni-input"
        id="agniInput"
        rows="1"
        placeholder="Ask Agni something..."
        aria-label="Type your message"
        required
      ></textarea>

      <button class="agni-send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M21 3 10 14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="m21 3-7 18-4-7-7-4 18-7Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </form>

    <div class="agni-powered">
      Agni provides general guidance. Please verify academic requirements.
    </div>
  </section>

  <!-- Floating launcher -->
  <button
    class="agni-launcher"
    id="agniLauncher"
    aria-label="Open Agni chatbot"
    aria-expanded="false"
  >
    <svg viewBox="0 0 24 24" fill="none">
      <path
        d="M13.5 2.5c.5 3.3-1.4 4.5-2.7 6.1-1.1 1.3-1.5 2.6-.9 4.2.3-1.7 1.5-2.6 2.8-3.4-.1 2.2 1.9 3.4 2.1 5.4.2-1.2-.1-2.3-.7-3.3 2.1 1.7 3.3 3.6 3.3 5.8 0 3.4-2.7 5.8-6.1 5.8s-6.3-2.4-6.3-6c0-3.1 2.1-5.2 4.4-7.2-.2 2.1.3 3.4 1.3 4.2-.6-2.8 1.4-5.2 2.8-7.1.8-1.1 1.3-2.8 0-4.5Z"
        fill="white"
      />
    </svg>
  </button>
</div>

<script src="agni-widget.js"></script>
